<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ '/assets/images/jungle-coffee-mark.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
        <img src="{{ '/assets/images/jungle-coffee-mark.svg' | relative_url }}" alt="" width="36" height="36">
        <span>{{ site.title }}</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/Homepage.html' | relative_url }}">Vault Homepage</a>
        <a href="{{ '/All%20About%20Coffee%20%E2%80%94%20Map%20of%20Content.html' | relative_url }}">Map of Content</a>
      </nav>
    </header>

    <main class="page-shell">
      <article class="prose">
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <p>{{ site.description }}</p>
    </footer>
  </body>
</html>
